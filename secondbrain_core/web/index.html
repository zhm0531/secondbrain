<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SecondBrain</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">LOCAL MEMORY CORE</p>
        <h1>SecondBrain</h1>
      </div>
      <div class="topbar-actions">
        <span id="service-status" class="status-dot">连接中</span>
        <button id="refresh-button" class="button secondary">刷新</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar panel">
        <section>
          <h2>筛选</h2>
          <label>搜索记忆<input id="search-input" type="search" placeholder="关键词" /></label>
          <label class="label-with-help"><span>生效范围</span><button type="button" class="help-button" data-help="scope-help">?</button>
            <select id="scope-select">
              <option value="">全部生效范围</option>
              <option value="global">全局</option>
              <option value="agent">Agent 内</option>
              <option value="project">项目内</option>
              <option value="session">会话内</option>
            </select>
            <span id="scope-help" class="help-popover hidden">全局：所有允许访问的 Agent 和项目都可使用。<br>Agent 内：只有指定 Agent 的会话可使用。<br>项目内：获得项目授权的 Agent 可使用。<br>会话内：只在当前会话中使用。</span>
          </label>
          <label>Agent<select id="agent-select"><option value="">全部 Agent</option></select></label>
          <label>项目<select id="project-select"><option value="">全部项目</option></select></label>
          <label class="checkbox-row"><input id="include-candidates" type="checkbox" />显示候选记忆</label>
          <button id="search-button" class="button primary full-width">搜索</button>
        </section>

        <section class="create-section">
          <h2>新建候选记忆</h2>
          <form id="create-form">
            <label>内容<textarea id="new-content" rows="4" required placeholder="输入要保存的内容"></textarea></label>
            <label>类型
              <select id="new-type">
                <option value="fact">事实</option>
                <option value="preference">偏好</option>
                <option value="decision">决策</option>
                <option value="instruction">规则</option>
                <option value="context">背景</option>
                <option value="open_loop">待解决问题</option>
                <option value="summary">摘要</option>
              </select>
            </label>
            <label class="label-with-help"><span>生效范围</span><button type="button" class="help-button" data-help="new-scope-help">?</button>
              <select id="new-scope">
                <option value="global">全局</option>
              <option value="agent">Agent 内</option>
              <option value="project">项目内</option>
              <option value="session">会话内</option>
              </select>
            <span id="new-scope-help" class="help-popover hidden">全局：所有允许访问的 Agent 和项目都可使用。<br>Agent 内：只有指定 Agent 的会话可使用。<br>项目内：获得项目授权的 Agent 可使用。<br>会话内：只在当前会话中使用。</span>
            </label>
            <label>来源 Agent<select id="new-agent-select"><option value="">未指定</option></select></label>
            <label>所属项目<select id="new-project-select"><option value="">未指定</option></select></label>
            <button class="button primary full-width" type="submit">保存到候选区</button>
          </form>
        </section>
      </aside>

      <section class="list-column">
        <div class="section-heading">
          <div>
            <p class="eyebrow">MEMORIES</p>
            <h2>记忆列表</h2>
          </div>
          <span id="result-count" class="muted">0 条</span>
        </div>
        <div id="memory-list" class="memory-list"></div>
      </section>

      <section class="detail-column panel">
        <div id="empty-detail" class="empty-state">
          <p class="eyebrow">DETAIL</p>
          <h2>选择一条记忆</h2>
          <p>在左侧搜索或创建记忆后，可以在这里查看来源、修改内容并审核候选。</p>
        </div>
        <div id="memory-detail" class="hidden">
          <div class="detail-header">
            <div>
              <p id="detail-status" class="badge"></p>
              <h2 id="detail-title"></h2>
            </div>
            <button id="close-detail" class="icon-button" title="关闭">×</button>
          </div>
          <div id="detail-meta" class="meta-grid"></div>
          <label>内容<textarea id="detail-content" rows="12"></textarea></label>
          <div class="detail-actions">
            <button id="save-button" class="button primary">保存修改</button>
            <button id="approve-button" class="button success">确认</button>
            <button id="reject-button" class="button danger">拒绝</button>
            <button id="archive-button" class="button secondary">归档</button>
          </div>
          <p id="detail-message" class="message"></p>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
